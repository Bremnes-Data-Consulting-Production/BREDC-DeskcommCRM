name: BREDC Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - bredc/english-ui

permissions:
  contents: read
  packages: write

concurrency:
  group: bredc-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/bremnes-data-consulting-production/bredc-deskcommcrm
  WORKER_IMAGE: ghcr.io/bremnes-data-consulting-production/bredc-deskcomm-worker

jobs:
  app:
    name: Build BREDC DeskcommCRM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=bredc-english-ui
          tags: |
            ${{ env.APP_IMAGE }}:english-ui
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  worker:
    name: Build BREDC Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          build-args: |
            APP_VERSION=bredc-english-ui
          tags: |
            ${{ env.WORKER_IMAGE }}:english-ui
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
